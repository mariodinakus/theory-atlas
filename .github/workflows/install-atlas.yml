name: Install THEORY ATLAS source
on:
  push:
    paths:
      - '.bootstrap/part06.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and restore project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          files = [Path('.bootstrap') / f'part{i:02}.b64' for i in range(1,7)]
          for p in files:
              if not p.is_file():
                  raise RuntimeError(f'Missing payload: {p}')
          encoded = ''.join(p.read_text() for p in files)
          data = base64.b64decode(encoded, validate=True)
          expected_sha = 'c58c1fd930847bfc6b6902d284676215240fdb6d1125ba62d65b99b6613fe589'
          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(f'Payload SHA256 mismatch: {actual_sha}')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as bundle:
              names = [m.name for m in bundle.getmembers()]
              for name in names:
                  p = Path(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise RuntimeError(f'Invalid archive member: {name}')
              bundle.extractall('.', filter='data')
          print(f'Installed {len(names)} files')
          PY
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install THEORY ATLAS source from verified archive"
          git push
